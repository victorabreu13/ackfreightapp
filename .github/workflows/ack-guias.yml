name: ACK Guías

on:
  push:
    branches: [master, main, ack-guias]
    paths:
      - "ack-guias/**"
      - ".github/workflows/ack-guias.yml"
  pull_request:
    paths:
      - "ack-guias/**"
      - ".github/workflows/ack-guias.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ack-guias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - name: poppler for PDF text checks
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
